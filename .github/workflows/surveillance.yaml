on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  monitoring_job:
    runs-on: ubuntu-latest
    name: "Monitoring job"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: "Check for updates"
        uses: lcian/website-change-monitor-action@v1
        id: check
        with:
          url: "https://hopcash.ch/530-ps5"
          discord-webhook-url: ${{ secrets.DISCORD_WEBHOOK }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
