name: Surveillance consoles PS5
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifier les consoles PS5
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
        run: bash scripts/ps5.sh
